amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    robot_model_type: "nav2_amcl::OmniMotionModel"
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_d: 0.10
    update_min_a: 0.10
    min_particles: 500
    max_particles: 2000
    laser_max_range: 18.0
    save_pose_rate: -1.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.3

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.10
      use_astar: true
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 12.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.18
      yaw_goal_tolerance: 0.26
      stateful: true
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: 0.0
      max_vel_x: 0.33
      min_vel_y: -0.22
      max_vel_y: 0.22
      max_vel_theta: 0.65
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      acc_lim_x: 0.9
      acc_lim_y: 0.9
      acc_lim_theta: 1.8
      decel_lim_x: -0.9
      decel_lim_y: -0.9
      decel_lim_theta: -1.8
      vx_samples: 10
      vy_samples: 9
      vtheta_samples: 16
      sim_time: 1.4
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.18
      trans_stopped_velocity: 0.08
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.05
      PathAlign.scale: 18.0
      PathAlign.forward_point_distance: 0.20
      GoalAlign.scale: 12.0
      GoalAlign.forward_point_distance: 0.20
      PathDist.scale: 22.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 28.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.43
      plugins: ["obstacles", "inflation"]
      obstacles:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 2.0
          expected_update_rate: 0.6
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
      inflation:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.75
        cost_scaling_factor: 4.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 3.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.43
      plugins: ["static_layer", "obstacles", "inflation"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacles:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 2.0
          expected_update_rate: 0.6
          obstacle_max_range: 8.0
          raytrace_max_range: 9.0
      inflation:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.75
        cost_scaling_factor: 4.0
